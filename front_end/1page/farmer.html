<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>තේ පොහොර බෙදා හැරීමෙ පද්දතිය</title>
    <style>
        body{
            background-image: url('https://bmkltsly13vb.compat.objectstorage.ap-mumbai-1.oraclecloud.com/cdn.dailymirror.lk/media/images/image_1476108618-37cfd999c7.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            
        }
        .bottom-right-logo {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 100px; 
            height: auto;
            z-index: 1000; 
        }
    </style>
</head>
<body>
    <center>
        <table width="90%" cellpadding="25" cellspacing="0" bgcolor="green">
            <tr>
                <td align="center" bgcolor="green">
                    <font color-="black" size="7"><b>කුඩා තේ වතු හිමියන් ලියාපදිංචි සදහා</b></font>
                    <p>
                        <font color="white" size="3">
                            <b>
                                නිවැරදි තොරතුරු ඇතුලත් කිරීමට වගබලා ගන්න!
                            </b>
                        </font>
                    </p>
                </td>
            </tr>
        </table>
        <br>
        <table width="60%" cellpadding="25" cellspacing="0" bgcolor="rgba(255, 255, 255, 0.85)" style="border-radius: 10px;">
            <tr align="center" bgcolor="white">
                <td align="left" bgcolor="white">
                <form>
                    <hr color="green">
                    <h3>    
                    <font color="green" size="4">
                        <b>
                             පුද්ගලික තොරතුරු
                        </b>
                    </font>
                    </h3>
                    <hr color="green">
                    <br><br>
                    <label for="fullname"><font size="2" color="black">වාසගම සමග නම ඇතුලත් කරන්න     : </font></label>
                    <input type="text" id="fullname" name="fullname">
                    <br><br>
                    <label for="nic"><font size="2" color="black">ජාතික හැදුනුම්පත් අංකය ඇතුලත් කරන්න : </font></label>
                    <input type="text" id="nic" name="nic">
                    <br><br>
                    <label for="moblie"><font size="2" color="black">ජංගම දුරකතන අංකය ඇතුලත් කරන්න : </font></label>
                    <input type="tel" id="mobile" name="mobile">
                    <br><br>
                    <label for="address"><font size="2" color="black">ලිපිනය ඇතුලත් කරන්න : </font></label>
                    <br><br>
                    <textarea id="address" name="address" rows="5" cols="40"></textarea>
                    <br><br>
                    <label for="photo"><font size="2" color="black">ඔබගෙ ඡායාරූපයක් ඇතුල්කරන්න : </font></label>
                    <input type="file" id="photo" name="photo">
                    <hr color="green">
                    <h3>
                        <font color="green" size="4">
                            <b>
                                තේ ඉඩම පිලිබද තොරතුරු
                            </b>

                        </font>
                    </h3>
                    <hr color="green">
                    <label for="name"><font size="2" color="black">ඉඩමේ නම : </font></label>
                    <input type="text" id="name" name="nol">
                    <br><br>
                    <label for="name"><font size="2" color="black">ග්‍රාම නිලදාරී වසම : </font></label>
                    <input type="text" id="name" name="gdr">
                    <br><br>
                    <label for="name"><font size="2" color="black">ප්‍රාදේශිය ලේකම් කොට්ටාසය : </font></label>
                    <input type="text" id="name" name="nol">
                    <br><br>
                    <label for="name"><font size="2" color="black">තේ දලු ලබාදෙන කර්මාන්තශාලාවෙ : </font></label>
                    <input type="text" id="name" name="nol">
                    <br><br>
                    <label for="rog.no"><font size="2" color="black">ඉඩමේ ලියාපදිංචි අංකය : </font></label>
                    <input type="reg.no" id="reg.no" name="reg.no">
                    <br><br>
                    <label for="area"><font size="2" color="black">ඉඩමේ ප්‍රමනය : </font></label>
                    <input type="area" id="area" name="aol">
                    <br><br>
                    <label for="date"><font size="2" color="black">වගාව ආරම්බ කල දිනය ආසන්න ලෙස : </font></label>
                    <input type="date" id="name" name="nol">
                    <br><br>
                    <label for="count"><font size="2" color="black">පැල සංඛ්‍යාව : </font></label>
                    <input type="text" id="name" name="nol">
                    <br><br>
                    <hr color="green">
                    <h3>
                        <font color="green" size="4">
                            <b>
                                අස්වැන්න සහ පොහොර අවශය්තාව පිලිබද තොරතුරු
                            </b>

                        </font>
                    </h3>
                    <hr color="green">
                    <label for="wight"><font size="2" color="black">මාසිකව නෙලන දලු ප්‍රමානය(KG) : </font></label>
                    <input type="number" id="wom" name="wom">
                    <br><br>
                    <h3><font color="black">මාසික තේ දලු ප්‍රමානයෙ වර්දනයක් තිබේද? : </font></h3>

                    <input type="radio" id="ඔව්" name="දලු ප්‍රමානය" value="ඔව්">
                    <label for="ඔව්"><font size="2" color="black">ඔව්</font></label>

                    <br>

                     <input type="radio" id="නැත" name="දලු ප්‍රමානය" value="නැත">
                     <label for="නැත"><font size="2" color="black">නැත</font></label>

                    <br>
                    <h3><font color="black">සපයන ලද පොහොර වලින් වගාවට කිසියම් අහිතකර බලපෑමක් තිබේද? : </font></h3>

                    <input type="radio" id="ඔව්" name="දලු ප්‍රමානය" value="ඔව්">
                    <label for="ඔව්"><font size="2" color="black">ඔව්</font></label>

                    <br>

                     <input type="radio" id="නැත" name="දලු ප්‍රමානය" value="නැත">
                     <label for="නැත"><font size="2" color="black">නැත</font></label>

                    <br> 
                    <hr color="green">

                    <input type="submit" value="ඉදිරිපත්කරන්න" style="background-color: greenyellow; color:white">
                    <input type="submit" value="අයදුම්පත්‍රයමකාදමන්න" style="background-color: red; color:white">
                    <hr color="green">


                    
                    
                    
                    
                </form>  
                 

                </td>
            </tr>
        </table>

    </center>

<img src="logo.png.png" alt="logo photo" class="bottom-right-logo">    
    
    
</body>
</html>
