<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>තේ පොහොර බෙදා දීමේ පද්දතිය</title>
    
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0d5225;
            color: #333;
        }

        /* Header Section Styles */
        .main-header {
            display: flex;
            align-items: center;
            background-color: #0d5225;
            padding: 15px 20px;
            border-bottom: 2px solid #000;
        }

        .logo-box {
            background-color: #ffffff;
            padding: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 170px;
            height: 170px;
        }

        .header-logo {
            width: 150px;
            height: auto;
        }

        .title-box {
            flex: 1;
            padding-left: 25px;
        }

        .title-box h1 {
            color: #4cd936;
            font-size: 35px;
            font-weight: normal;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .title-box p {
            color: #4cd936;
            font-size: 22px;
            margin-top: 15px;
        }

        /* User Photo Box Styles */
        .user-photo-box {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-right: 20px;
        }

        .photo-circle {
            width: 160px;
            height: 160px;
            background-color: #dcdcdc;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid #ffffff;
        }

        .photo-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Layout Body Styles */
        .main-body {
            display: flex;
            min-height: calc(100vh - 200px);
            background-color: #0d5225;
        }

        .sidebar {
            width: 220px;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .nav-btn {
            display: block;
            background-color: #4cd936;
            color: #ffffff;
            border: none;
            padding: 15px 10px;
            font-size: 18px;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: normal;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: #3cb828;
        }

        .content-area {
            flex: 1;
            padding: 20px;
            display: flex;
            gap: 20px;
        }

        /* Info Card Styles */
        .info-card {
            background-color: #dcdcdc;
            padding: 25px;
            width: 100%;
        }

        .info-card h2 {
            font-size: 22px;
            color: #000000;
            font-weight: normal;
            margin-bottom: 10px;
        }

        .custom-hr {
            border: none;
            height: 2px;
            background-color: #000000;
            margin: 15px 0;
        }

        /* Table Container & Styles */
        .table-container {
            width: 100%;
            margin-top: 20px;
            overflow-x: auto;
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .history-table th, 
        .history-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .history-table th {
            background-color: #0d5225;
            color: #ffffff;
            font-size: 15px;
            font-weight: bold;
        }

        .history-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .history-table tr:hover {
            background-color: #f1f1f1;
        }

        .history-table td {
            color: #333333;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!--header-->
    <header class="main-header">
        <div class="logo-box">
            <img src="logo.png.png" alt="Logo" class="header-logo">
        </div>
        <div class="title-box">
            <h1>TEA FERTILIZER DISTRIBUTION SYSTEM</h1>
            <p>Please Make Sure Your Information Is Correct!</p>
        </div>
        <div class="user-photo-box">
            <div class="photo-circle">
                <img src="user-photo.jpg" alt="User Photo" id="userphoto">
            </div>
        </div>
    </header>

    <div class="main-body">
        
        <aside class="sidebar">
           <table class="button"> 
            <button class="nav-btn active">My Information</button>
            <button class="nav-btn active">Fertilizer Inquiries</button>
            <button class="nav-btn actice">Inquiries History</button>
            <button class="nav-btn actice">Farmers Complints</button>
           </table> 
        </aside>
        

        <!--right-->
        <main class="content-area">

            <section class="info-card">
                <h2>Farmers Complints</h2>
                <hr style="color:black width: 0.5px;">

                <div class="table-container">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>1. Farmer Id : 200119203645 </th>
                                <th>2. Farmer Name : W.S.Waidyrathna</th>
                               

                                
                            </tr>
                        </thead>
                        <tbody>
                            
                           
                            
                        </tbody>

                       
                    </table>
                    
                    
                </div>
                
            </section>    
        </main>        
                 
                   
                    
                    
    </div>

    
</body>
</html>
